<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>krittika lilani — project</title>
<style>
  :root { --red: #d6322b; --ink: #f2efe9; --dim: #8a8680; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #050505; color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* the bar that stays on top of every project */
  .bar {
    height: 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; border-bottom: 1px solid #222; font-size: 12px;
  }
  .bar a { color: var(--dim); text-decoration: none; }
  .bar a:hover { color: var(--ink); }
  .bar .back { color: var(--ink); }
  .bar .back:hover { color: var(--red); }

  /* the project itself, shown inside the page */
  #view { height: calc(100% - 44px); }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }

  .empty { height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px; }
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="index.html">← back to portfolio home</a>
  <span id="title"></span>
  <a id="newtab" href="#" target="_blank">open in new tab ↗</a>
</div>
<div id="view"></div>

<script src="projects.js"></script>
<script>
  // read which project to show from the link, e.g. project.html?p=laizy
  const id = new URLSearchParams(location.search).get("p");
  const p = PROJECTS.find(x => x.id === id);
  const view = document.getElementById("view");

  if (p) {
    document.title = "krittika lilani — " + p.title;
    document.getElementById("title").textContent = p.title;
  }

  if (p && p.url) {
    // show the project's own site inside this page (its files are not changed)
    view.innerHTML = `<iframe src="${p.url}" title="${p.title}"></iframe>`;
    document.getElementById("newtab").href = p.url;
  } else {
    view.innerHTML = `<div class="empty">coming soon</div>`;
    document.getElementById("newtab").style.display = "none";
  }
</script>
</body>
</html>
