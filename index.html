<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>krittika lilani — portfolio</title>
<style>
  :root { --red: #d6322b; --ink: #f2efe9; --dim: #8a8680; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: #070707; color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  a { color: inherit; }

  /* the 3D space: "perspective" makes cards further back look smaller */
  #stage {
    position: fixed; inset: 0;
    perspective: 1000px; perspective-origin: 50% 50%;
    cursor: grab; touch-action: none;
  }
  #stage.dragging { cursor: grabbing; }
  #world { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }

  /* soft dark edges */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 900;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.55) 100%);
  }

  /* one floating project */
  .card {
    position: absolute; left: 0; top: 0; cursor: pointer; pointer-events: auto;
    transition: opacity .5s;
  }
  .card .frame { width: 100%; height: 100%; transition: transform .3s, box-shadow .3s; }
  .card img, .card .ph { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card .tick {             /* small red corner square */
    position: absolute; left: -.4em; bottom: -.4em; width: .8em; height: .8em;
    border: 1px solid var(--red); pointer-events: none;
  }
  .card .label {            /* project name under the image */
    position: absolute; left: 0; top: 100%; margin-top: .6em;
    white-space: nowrap; color: rgba(242,239,233,.8); pointer-events: none;
  }
  .card:hover .frame { transform: scale(1.04); box-shadow: 0 0 0 1.5px var(--red); }
  .card.off { opacity: .07; pointer-events: none !important; }

  /* top bar */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 22px 28px; pointer-events: none;
  }
  header * { pointer-events: auto; }
  .name { font-size: 15px; letter-spacing: .02em; }
  .intro { font-size: 11px; color: var(--dim); margin-top: 6px; max-width: 340px; line-height: 1.5; }
  .links { font-size: 11px; display: flex; gap: 18px; }
  .links a { text-decoration: none; color: var(--dim); }
  .links a:hover { color: var(--ink); }

  /* category terms at the bottom */
  nav#terms {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  }
  nav#terms button {
    font: inherit; font-size: 11px; background: rgba(0,0,0,.5); color: var(--dim);
    border: 1px solid #333; padding: 6px 12px; cursor: pointer; letter-spacing: .04em;
  }
  nav#terms button:hover { color: var(--ink); border-color: #777; }
  nav#terms button.on { color: var(--ink); border-color: var(--red); }

  @media (max-width: 700px) {
    .intro { display: none; }
    .links { flex-direction: column; gap: 6px; text-align: right; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="name">krittika lilani</div>
    <!-- TODO: write your own one-line intro here -->
    <div class="intro">[your one-line intro]</div>
  </div>
  <div class="links">
    <a href="architecture-portfolio.pdf" target="_blank">architecture work (pdf)</a>
    <!-- TODO: add your résumé file and email -->
    <a href="resume.pdf" target="_blank">résumé</a>
    <a href="mailto:you@email.com">contact</a>
  </div>
</header>

<div id="stage"><div id="world"></div></div>
<div class="vignette"></div>
<nav id="terms"></nav>

<script src="projects.js"></script>
<script>
/* ---------- settings you can play with ---------- */
const P = 1000;          // must match "perspective" in the CSS
const DEPTH = 650;       // how far back the furthest card sits
const ZOOM_MIN = -700, ZOOM_MAX = 550;   // how far you can zoom out / in

/* seeded random: layout looks random but is the same every visit */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const stage = document.getElementById("stage");
const world = document.getElementById("world");
const nav   = document.getElementById("terms");
let cards = [];

/* camera: zoom (z), pan (x, y) and a small tilt that follows the mouse */
const cam  = { z: 0, x: 0, y: 0, tx: 0, ty: 0 };   // current
const goal = { z: 0, x: 0, y: 0, tx: 0, ty: 0 };   // where it's easing to
let dragging = false, moved = false, last = null;

/* ---------- one card per project ---------- */
PROJECTS.forEach((p, pi) => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `<div class="frame"></div><span class="tick"></span><span class="label"></span>`;
  el.querySelector(".label").textContent = p.title;

  const img = new Image();
  img.src = `images/${p.id}.jpg`;
  img.alt = p.title;
  img.draggable = false;
  // if the image isn't there yet, show a coloured placeholder
  img.onerror = () => {
    const ph = document.createElement("div");
    ph.className = "ph";
    const hue = pi * 55;
    ph.style.background = `linear-gradient(135deg, hsl(${hue},32%,36%), hsl(${hue + 30},28%,18%))`;
    img.replaceWith(ph);
  };
  el.querySelector(".frame").appendChild(img);

  el.addEventListener("click", () => {
    if (!moved) window.location.href = "project.html?p=" + p.id;
  });

  world.appendChild(el);
  cards.push({ el, p });
});

/* ---------- scatter cards: different depths, none covering another ---------- */
function layout() {
  const W = innerWidth, H = innerHeight, cx = W / 2, cy = H / 2;
  const s = Math.min(W / 1400, H / 850, 1.1) * (W < 700 ? 1.5 : 1);
  const r = rng(5);
  const placed = [];

  // closest first, so the big ones get space
  const order = cards.map(c => ({ c, t: r() })).sort((a, b) => b.t - a.t);

  order.forEach(({ c, t }) => {
    // t = 1 closest, t = 0 furthest back
    const sw = (150 + t * 150) * s;        // width as seen on screen
    const sh = sw * 0.66;
    const pad = 34 * s;                    // room for the label + spacing

    let best = null, bestHit = Infinity;
    for (let k = 0; k < 400; k++) {
      const sx = W * 0.06 + r() * (W * 0.88 - sw - 60 * s);
      const sy = H * 0.13 + r() * (H * 0.72 - sh - pad);
      let hit = 0;
      placed.forEach(q => {
        const ox = Math.max(0, Math.min(sx + sw + 70 * s, q.x + q.w + 70 * s) - Math.max(sx, q.x));
        const oy = Math.max(0, Math.min(sy + sh + pad, q.y + q.h + pad) - Math.max(sy, q.y));
        hit += ox * oy;
      });
      if (hit < bestHit) { bestHit = hit; best = { x: sx, y: sy }; }
      if (hit === 0) break;
    }
    placed.push({ x: best.x, y: best.y, w: sw, h: sh });

    // turn the screen spot into a spot in 3D space
    c.z = -(1 - t) * DEPTH;
    const k = P / (P - c.z);                // how much smaller it looks
    c.x = cx + (best.x - cx) / k;
    c.y = cy + (best.y - cy) / k;
    c.w = sw / k;
    c.h = sh / k;
    c.phase = r() * Math.PI * 2;
    c.speed = 0.12 + r() * 0.18;

    c.el.style.width = c.w + "px";
    c.el.style.height = c.h + "px";
    c.el.style.fontSize = (10 / k) + "px";  // keeps labels ~10px on screen
  });
}

/* ---------- interaction: drag to move, scroll / pinch to zoom ---------- */
stage.addEventListener("pointerdown", e => {
  dragging = true; moved = false; last = { x: e.clientX, y: e.clientY };
  stage.classList.add("dragging");
});
addEventListener("pointermove", e => {
  // small tilt following the mouse
  goal.tx = (e.clientX / innerWidth - 0.5) * 6;
  goal.ty = (e.clientY / innerHeight - 0.5) * -5;
  if (!dragging) return;
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  goal.x += dx; goal.y += dy;
  last = { x: e.clientX, y: e.clientY };
});
addEventListener("pointerup", () => {
  dragging = false; stage.classList.remove("dragging");
  setTimeout(() => moved = false, 0);
});
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const amount = e.ctrlKey ? e.deltaY * 6 : e.deltaY;   // trackpad pinch comes in as ctrlKey
  goal.z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, goal.z - amount));
}, { passive: false });
// double-click empty space to reset the view
stage.addEventListener("dblclick", () => Object.assign(goal, { z: 0, x: 0, y: 0 }));

/* ---------- animation loop ---------- */
function tick(time) {
  const t = time / 1000;
  for (const key in cam) cam[key] += (goal[key] - cam[key]) * 0.08;   // smooth easing

  world.style.transform =
    `translate3d(${cam.x}px, ${cam.y}px, ${cam.z}px) rotateX(${cam.ty}deg) rotateY(${cam.tx}deg)`;

  cards.forEach(c => {
    const fx = Math.sin(t * c.speed + c.phase) * 8;
    const fy = Math.cos(t * c.speed * 0.8 + c.phase) * 6;
    c.el.style.transform = `translate3d(${c.x + fx}px, ${c.y + fy}px, ${c.z}px)`;
  });
  requestAnimationFrame(tick);
}

/* ---------- category terms ---------- */
const terms = ["all", ...new Set(PROJECTS.flatMap(p => p.tags))];
terms.forEach(term => {
  const b = document.createElement("button");
  b.textContent = term;
  if (term === "all") b.classList.add("on");
  b.onclick = () => {
    nav.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    cards.forEach(c => c.el.classList.toggle("off", term !== "all" && !c.p.tags.includes(term)));
  };
  nav.appendChild(b);
});

layout();
addEventListener("resize", layout);
requestAnimationFrame(tick);
</script>
</body>
</html>
